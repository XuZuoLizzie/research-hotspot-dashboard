<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="访问当前仪表板和历史归档版本。">
  <title>看板首页</title>
  <link rel="stylesheet" href="./css/gateway.css">
  <script src="./js/gateway.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main-content">跳转到主要内容</a>

  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>
  <div class="grid-bg" aria-hidden="true"></div>

  <div class="page-shell">
    <header class="site-header">
      <a class="brand" href="./" aria-label="仪表板门户首页">
        <span class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        </span>
        <span><strong>仪表板门户</strong><small>版本访问中心</small></span>
      </a>
      <span class="deployment-state"><span aria-hidden="true">✓</span> 已适配静态部署</span>
    </header>

    <main id="main-content" class="hero">
      <section class="intro" aria-labelledby="page-title">
        <div class="status-pill"><span aria-hidden="true">✓</span> 当前版本可用</div>
        <h1 id="page-title">医学文献智能分析看板</h1>
        <p class="lead">动态追踪、分析并可视化展示全球高分医学影像期刊发表的最新研究。</p>
        <div class="actions">
          <a id="current-dashboard-link" class="button button-primary" href="./current/">打开最版版本 <span aria-hidden="true">→</span></a>
          <a class="button button-secondary" href="#archive">浏览历史版本 <span aria-hidden="true">▣</span></a>
        </div>
        <ul class="features" aria-label="门户功能">
          <li><span aria-hidden="true">◷</span> 当前版本</li>
          <li><span aria-hidden="true">□</span> 日期快照</li>
          <li><span aria-hidden="true">↗</span> 浏览链接</li>
        </ul>
      </section>

      <section id="archive" class="archive-card" aria-labelledby="archive-title">
        <div class="archive-head">
          <div class="archive-title-row">
            <div><h2 id="archive-title">历史归档版本</h2><p>选择一个历史版本进行访问。</p></div>
            <span id="release-count" class="release-count">0 个版本</span>
          </div>
          <label class="search-box">
            <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
            <span class="sr-only">搜索历史版本</span>
            <input id="release-search" type="search" placeholder="按日期搜索" autocomplete="off">
          </label>
        </div>
        <div id="release-list" class="release-list" aria-live="polite"></div>
        <noscript><p class="empty-state">需要启用 JavaScript 才能显示归档列表。您仍可通过 versions 目录中的直接链接访问历史版本。</p></noscript>
      </section>
    </main>

    <footer><span>看板首页</span><span>当前版本及归档历史版本</span></footer>
  </div>
</body>
</html>
